<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Fobos, un server di test di Industree Hub">
<title>Fobos — Industree Hub</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #060304; overflow: hidden; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fallback {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    background: #060304;
    font: 300 1rem/1.8 "Helvetica Neue", Helvetica, Arial, sans-serif;
    text-align: center; color: #3a2a26;
  }
  #fallback strong { font-size: 2.5rem; font-weight: 800; letter-spacing: .3em; color: #5a342c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">
  <strong>FOBOS</strong>
  <span>un server di test di Industree Hub</span>
</div>

<script>
(function () {
'use strict';

// ═══════════════════════════════════════════════
// VERTEX
// ═══════════════════════════════════════════════
var VS = [
'attribute vec2 a_pos;',
'varying vec2 v_uv;',
'void main(){',
'  v_uv = a_pos * 0.5 + 0.5;',
'  gl_Position = vec4(a_pos, 0.0, 1.0);',
'}'
].join('\n');

// ═══════════════════════════════════════════════
// FRAGMENT — seta / inchiostro liquido
// ═══════════════════════════════════════════════
var FS = [
'precision highp float;',
'varying vec2 v_uv;',
'uniform float u_time;',
'uniform vec2  u_mouse;',
'uniform float u_interact;',
'uniform vec2  u_res;',
'uniform vec2  u_seed;',    // random per ogni caricamento
'uniform sampler2D u_text;',

// ─── Value noise SMOOTH (quintic) — niente grana ───
'float hash(vec2 p){',
'  p = fract(p*vec2(123.34, 456.21));',
'  p += dot(p, p+45.32);',
'  return fract(p.x*p.y);',
'}',
// Quintic smoothstep → derivata continua → gradienti vellutati
'float vnoise(vec2 p){',
'  vec2 i=floor(p), f=fract(p);',
'  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);',
'  float a=hash(i+vec2(0,0));',
'  float b=hash(i+vec2(1,0));',
'  float c=hash(i+vec2(0,1));',
'  float d=hash(i+vec2(1,1));',
'  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);',
'}',

// FBM bassissima frequenza, sole 3 ottave — campo fluido, mai grana
'float flow(vec2 p){',
'  float v=0.0;',
'  v += 0.60*vnoise(p);          p = p*1.9 + vec2(2.1, 8.3);',
'  v += 0.30*vnoise(p);          p = p*1.9 + vec2(5.7, 1.2);',
'  v += 0.10*vnoise(p);',
'  return v;',
'}',

// ─── ACES filmic ─────────────────────────────
'vec3 aces(vec3 x){',
'  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);',
'}',

// Dither triangolare sotto-soglia (anti-banding, NON grana)
'float dither(vec2 uv){',
'  float r = hash(uv*vec2(311.7,127.1));',
'  float g = hash(uv*vec2(269.5,183.3)+17.0);',
'  return (r+g-1.0);',  // distribuzione triangolare [-1,1]
'}',

// ═══════════════════════════════════════════════
'void main(){',
'  vec2 uv = v_uv;',
'  float ar = u_res.x / u_res.y;',
'  vec2 auv    = vec2((uv.x-0.5)*ar, uv.y-0.5);',
'  vec2 amouse = vec2((u_mouse.x-0.5)*ar, u_mouse.y-0.5);',
'  float t = u_time;',

// ─── DOMAIN WARP doppio (pieghe di raso) ──────
// Movimento idle quasi nullo: coefficienti minuscoli
'  vec2 p = uv * vec2(2.6*ar, 2.6) + u_seed;',   // offset random → pieghe diverse ad ogni load
'  vec2 q = vec2(',
'    flow(p + vec2(0.0, 0.0) + t*0.008),',
'    flow(p + vec2(5.2, 1.3) - t*0.006)',
'  );',
'  vec2 r = vec2(',
'    flow(p + 3.0*q + vec2(1.7, 9.2) + t*0.010),',
'    flow(p + 3.0*q + vec2(8.3, 2.8) - t*0.007)',
'  );',
'  float silk = flow(p + 2.4*r);',          // campo di altezza della seta

// Pendenza per lo sheen anisotropo
'  float e = 0.0016;',
'  float sx = flow(p+vec2(e,0.0)+2.4*r) - silk;',
'  float sy = flow(p+vec2(0.0,e)+2.4*r) - silk;',
'  vec2 slope = vec2(sx, sy)/e;',

// ─── PALETTE SETA (carbone → rosso-fumo) ─────
'  vec3 deep   = vec3(0.024, 0.014, 0.012);',   // piega profonda
'  vec3 carbon = vec3(0.075, 0.050, 0.046);',   // carbone
'  vec3 smoke  = vec3(0.230, 0.075, 0.060);',   // rosso-fumo sulle creste
'  vec3 col = mix(deep, carbon, smoothstep(0.30, 0.62, silk));',
'  col = mix(col, smoke, smoothstep(0.60, 0.92, silk));',

// ─── SHEEN ANISOTROPO IRIDESCENTE (il "setoso") ──
// Highlight allungato lungo la direzione del flusso
'  float sheenDir = slope.x*0.7 - slope.y*0.7;',
'  float sheenPhase = silk*7.0 + sheenDir*2.2;',
'  float sheen = pow(clamp(0.5+0.5*sin(sheenPhase), 0.0, 1.0), 3.5);',
// Iridescenza calda: il riflesso vira tra rame e cremisi (thin-film, gamut caldo)
'  float irid = 0.5 + 0.5*sin(sheenPhase*0.5 + silk*3.0);',
'  vec3 copper  = vec3(0.40, 0.20, 0.11);',
'  vec3 crimson = vec3(0.34, 0.06, 0.05);',
'  vec3 sheenCol = mix(crimson, copper, irid);',
'  col += sheenCol * sheen * smoothstep(0.45,0.95,silk) * (1.0 - u_interact*0.6);',

// ─── BANDA SATINATA che scorre lentissima ────
// Luce di studio che attraversa il tessuto — direzione random ad ogni load
'  float bang = u_seed.x*1.7 + u_seed.y*0.9;',
'  vec2 bdir = normalize(vec2(cos(bang), sin(bang)) + 0.0001);',
'  float bandCoord = dot(uv, bdir) - t*0.009;',
'  float band = pow(0.5+0.5*sin(bandCoord*3.1416 + u_seed.y*6.2831), 2.2);',
'  col += sheenCol * band * sheen * 0.5 * (1.0 - u_interact*0.6);',

// ─── BRACE ROSSA DIFFUSA (liscia, respira) ───
// Vive nelle creste della seta, pulsazione ipnotica con fase random
'  float breath = 0.55 + 0.45*sin(t*0.13 + silk*4.0 + u_seed.x*6.2831);',
'  float emberMask = smoothstep(0.55, 0.95, silk);',
// Tinta calda lievemente variabile ad ogni load (cremisi ↔ rosso-arancio)
'  float warmth = 0.5 + 0.5*sin(u_seed.x*2.3 + u_seed.y*1.1);',
'  vec3 emberCol = mix(vec3(0.46,0.070,0.045), vec3(0.55,0.110,0.022), warmth);',
'  col += emberCol * emberMask * breath * 0.40 * (1.0 - u_interact*0.78);',
// Bagliore caldo atmosferico globale
'  col += vec3(0.030, 0.006, 0.004) * silk * (1.0 - u_interact*0.7);',

// ─── LUCE BLU LIQUIDA (interazione) ──────────
'  float ir  = u_interact;',
'  float ir2 = ir*ir;',
'  float ir4 = ir2*ir2;',

// FLUSSO TEMPORALE DEDICATO ALLA LUCE → illuminazione fluida.
// Più vivo della seta (che resta lentissima): i bordi ondeggiano e colano.
'  vec2 lflow = vec2(',
'    flow(p*0.85 + vec2( t*0.060, -t*0.018) + 11.3),',
'    flow(p*0.85 + vec2(-t*0.022,  t*0.055) + 23.7)',
'  ) - 0.5;',
// La posizione del campione viene spinta dal flusso → la luce cola come
// inchiostro vivo, non un cerchio. Combina flusso animato + warp della seta.
'  vec2 inkOffset = (lflow*0.30 + (r-0.5)*0.16) * (0.45 + ir);',
'  vec2 lp = auv + inkOffset;',
'  float dist = length(lp - amouse);',

// Solo luce DIFFUSA: nessun nucleo stretto/hotspot.
// Raggio grande già a riposo, con respiro morbido che lo fa pulsare.
'  float lR = (0.30 + ir2*0.75) * (1.0 + 0.06*sin(t*0.45 + silk*3.0));',
// Modulazione morbida del raggio col flusso vivo → bordo organico, mai un punto
'  float lRm = lR * (0.85 + 0.30*silk + 0.10*lflow.x);',
// Gaussiana ampia (peso maggiore) + alone ancora più largo, nessun picco netto
'  float glow = exp(-dist*dist / (lRm*lRm + 0.0001));',
'  float wide = exp(-dist*dist / (lR*lR*3.5 + 0.0001));',

// Riempimento ambientale liscio dal centro
'  float cDist = length(auv*0.5);',
'  float ambient = ir4*0.60*exp(-cDist*2.2);',

// Combinazione pesata e morbida (no max → no bordo del picco), intensità contenuta
'  float light = (glow*0.62 + wide*0.38) * ir;',
'  light = max(light, ambient*ir);',

// ─── COLORE LUCE DIFFUSA: abisso → cobalto (niente nucleo bianco) ─
'  float lr = clamp(dist/max(lR,0.01), 0.0, 2.2);',
'  vec3 ice    = vec3(0.918, 0.965, 1.000);',
'  vec3 cobalt = vec3(0.162, 0.502, 1.000);',
'  vec3 abyss  = vec3(0.039, 0.118, 0.353);',
'  vec3 lightCol = mix(abyss, cobalt, smoothstep(1.6, 0.20, lr));',

// Blend morbido — intensità contenuta, nessun hotspot/faro
'  col = mix(col, lightCol, clamp(light*0.92, 0.0, 0.82));',
'  col += lightCol * light * 0.30;',
'  col += abyss * ambient * 0.9;',

// Riflesso satinato freddo sulla seta illuminata (sheen vira al blu)
'  col += vec3(0.10,0.30,0.55) * sheen * light * 0.5;',

// ─── TESTO — campionamento che PRESERVA le proporzioni ───
// La texture è 2:1; mappata "contain" + zoom così non si deforma mai
// con l\'aspect ratio dello schermo (fondamentale in portrait su iPhone)
'  float texAspect = 2.0;',
'  float fitT = min(ar/texAspect, 1.0) * 1.42;',
'  vec2 tuv = vec2(auv.x/(texAspect*fitT), auv.y/fitT) + 0.5;',
'  vec2 inb = step(vec2(0.0), tuv) * step(tuv, vec2(1.0));',
'  float tx = texture2D(u_text, tuv).r * inb.x * inb.y;',
// Testo SEMPRE presente: a riposo quasi nero (silhouette appena percettibile),
// in interazione sfuma al bianco. FOBOS (alto) schiarisce prima del sottotitolo.
'  float depth = 1.0 + (1.0-uv.y)*0.55;',
'  float rev = smoothstep(0.02, 0.45*depth, light);',
'  rev = max(rev, smoothstep(0.12, 0.85, u_interact)*0.9);',  // qualunque interazione schiarisce
'  vec3 tcol = mix(vec3(0.0), vec3(1.0), rev);',              // nero → bianco
'  float a = tx * mix(0.22, 0.99, rev);',                    // velo scuro a riposo, pieno in interazione
'  col = mix(col, tcol, a);',
// Glow freddo attorno alle lettere, solo quando la luce arriva
'  col += mix(cobalt, ice, 0.5) * smoothstep(0.04,0.30,light) * tx * 0.30;',

// ─── POST ─────────────────────────────────────
// Drappo verticale: la parte alta lievemente più scura → volume
'  col *= 0.88 + 0.12*uv.y;',

// Vignette morbida voluminosa
'  float vd = length((uv-0.5)*vec2(1.05,1.0))*2.2;',
'  float vig = 1.0 - smoothstep(0.25, 1.05, vd);',
'  col *= 0.38 + 0.62*vig;',

// Tone mapping filmico
'  col = aces(col*1.20);',

// Color grading: ombre fredde, alte luci calde (split-tone cinematografico)
'  float luma = dot(col, vec3(0.299,0.587,0.114));',
'  col += vec3(-0.010,0.0,0.018) * (1.0-luma);',   // ombre verso il blu
'  col += vec3( 0.014,0.004,-0.006) * luma;',       // luci verso il caldo
'  col = clamp(col, 0.0, 1.0);',
// Saturazione +leggera e contrasto morbido
'  col = mix(vec3(luma), col, 1.10);',
'  col = clamp((col-0.5)*1.06 + 0.5, 0.0, 1.0);',

// Dither sotto-soglia: uccide il banding, invisibile come grana
'  col += dither(uv*u_res) * (1.0/255.0);',

'  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);',
'}'
].join('\n');

// ═══════════════════════════════════════════════
// BOOTSTRAP WebGL
// ═══════════════════════════════════════════════
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false})
      || canvas.getContext('experimental-webgl',{antialias:false,alpha:false});

if (!gl) {
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}

function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('[shader]', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

var prog = gl.createProgram();
var vs = compile(gl.VERTEX_SHADER, VS);
var fs = compile(gl.FRAGMENT_SHADER, FS);
if (!vs || !fs) {
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('[program]', gl.getProgramInfoLog(prog));
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}
gl.useProgram(prog);

var vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var U = {
  time:     gl.getUniformLocation(prog,'u_time'),
  mouse:    gl.getUniformLocation(prog,'u_mouse'),
  interact: gl.getUniformLocation(prog,'u_interact'),
  res:      gl.getUniformLocation(prog,'u_res'),
  seed:     gl.getUniformLocation(prog,'u_seed'),
  text:     gl.getUniformLocation(prog,'u_text')
};

// Seed random per ogni caricamento → composizione sempre diversa
var seedX = Math.random()*1000.0;
var seedY = Math.random()*1000.0;
gl.uniform2f(U.seed, seedX, seedY);

// ═══════════════════════════════════════════════
// TEXTURE TESTO — cascata di font di sistema moderni
//   su iPhone/Mac → SF Pro, Windows → Segoe UI, Android → Roboto
// ═══════════════════════════════════════════════
var SYS = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

// Disegna testo centrato con tracking (spaziatura) manuale e robusto
function drawTracked(ctx, text, cx, y, trackPx) {
  var widths = [], total = 0;
  for (var i = 0; i < text.length; i++) {
    var w = ctx.measureText(text[i]).width;
    widths.push(w);
    total += w + (i < text.length - 1 ? trackPx : 0);
  }
  var x = cx - total / 2;
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  for (var j = 0; j < text.length; j++) {
    ctx.fillText(text[j], x, y);
    x += widths[j] + trackPx;
  }
  ctx.textAlign = prevAlign;
}

function buildTextTexture(existing) {
  var W = 2048, H = 1024;
  var tc = document.createElement('canvas');
  tc.width = W; tc.height = H;
  var ctx = tc.getContext('2d');

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';

  var cx   = W/2;
  var tyY  = H*0.380;
  var sepY = H*0.520;
  var suY  = H*0.620;

  // ── FOBOS — semibold, compatto, tracking quasi nullo ──
  var titleTrack = 4;
  ctx.font = '600 196px ' + SYS;
  ctx.save(); ctx.globalAlpha=0.09; ctx.filter='blur(34px)'; drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.20; ctx.filter='blur(15px)'; drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.42; ctx.filter='blur(5px)';  drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=1.00; ctx.filter='none';       drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();

  // ── Linea decorativa sottilissima con gradiente ──
  ctx.save();
  var lineW = 150;
  var g = ctx.createLinearGradient(cx-lineW, sepY, cx+lineW, sepY);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.55)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.strokeStyle = g; ctx.lineWidth = 1.0;
  ctx.beginPath(); ctx.moveTo(cx-lineW,sepY); ctx.lineTo(cx+lineW,sepY); ctx.stroke();
  ctx.restore();

  // ── Sottotitolo — regular, tracking minimo ──
  var sub = 'un server di test di Industree Hub';
  var subTrack = 3;
  ctx.font = '400 30px ' + SYS;
  ctx.save(); ctx.globalAlpha=0.13; ctx.filter='blur(12px)'; drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.38; ctx.filter='blur(3px)';  drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.92; ctx.filter='none';       drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();

  var tex = existing || gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

var textTex = buildTextTexture();
// Ricostruisce la texture quando i font di sistema sono pienamente pronti
// (metriche stabili) — su Apple garantisce SF Pro renderizzato correttamente
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){ buildTextTexture(textTex); });
}
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, textTex);
gl.uniform1i(U.text, 0);

// ═══════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width  = Math.round(window.innerWidth  * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.res, canvas.width, canvas.height);
}
window.addEventListener('resize', resize, { passive: true });
resize();

// ═══════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════
var tx=0.5, ty=0.5, sx=0.5, sy=0.5;
var interact=0.0, lastMove=-1e9, isActive=false;

function onMove(x, y) {
  var rc = canvas.getBoundingClientRect();
  tx = (x - rc.left)/rc.width;
  ty = 1.0 - (y - rc.top)/rc.height;
  lastMove = performance.now();
  isActive = true;
}
window.addEventListener('mousemove',  function(e){ onMove(e.clientX,e.clientY); }, {passive:true});
window.addEventListener('mouseleave', function(){  isActive=false; }, {passive:true});
window.addEventListener('touchstart', function(e){ onMove(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
window.addEventListener('touchmove',  function(e){ e.preventDefault(); onMove(e.touches[0].clientX,e.touches[0].clientY); }, {passive:false});
window.addEventListener('touchend',   function(){  isActive=false; }, {passive:true});

// ═══════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════
var startT = performance.now();
var prevT  = startT;

function render(now) {
  requestAnimationFrame(render);
  var dt = Math.min((now - prevT)*0.001, 0.05);
  prevT = now;
  var elapsed = (now - startT)*0.001;

  var alpha = 1.0 - Math.exp(-3.6*dt);  // lerp setoso, lento e languido
  sx += (tx - sx)*alpha;
  sy += (ty - sy)*alpha;

  var moving = isActive && (now - lastMove) < 120;
  if (moving) interact = Math.min(1.0, interact + dt*1.5);   // emersione lenta
  else        interact = Math.max(0.0, interact - dt*0.22);  // dissolvenza lenta

  gl.uniform1f(U.time,     elapsed);
  gl.uniform2f(U.mouse,    sx, sy);
  gl.uniform1f(U.interact, interact);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(render);

}());
</script>
</body>
</html>
