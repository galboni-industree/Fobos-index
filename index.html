<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Fobos, un server di test di Industree Hub">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c41f12'/%3E%3C/svg%3E">
<title>Fobos — Industree Hub</title>
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  html { background: #000; color-scheme: dark; }
  html, body, #app {
    width: 100%; height: 100%; background: #000;
  }
  body {
    overflow: hidden; cursor: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; touch-action: none; }
  #fallback {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    background: #000;
    font: 300 1rem/1.8 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; color: #3a2a26;
  }
  #fallback strong { font-size: 2.5rem; font-weight: 800; letter-spacing: .3em; color: #5a342c; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
</style>
</head>
<body style="background:#000">
<main id="app" aria-label="FOBOS, un server di test di Industree Hub">
<h1 class="sr-only">FOBOS</h1>
<p class="sr-only">Un server di test di Industree Hub</p>
<canvas id="c" aria-hidden="true"></canvas>
<div id="fallback" role="status">
  <strong>FOBOS</strong>
  <span>un server di test di Industree Hub</span>
</div>
</main>
<script>
(function () {
'use strict';
var VS = [
'attribute vec2 a_pos;',
'varying vec2 v_uv;',
'void main(){',
'  v_uv = a_pos * 0.5 + 0.5;',
'  gl_Position = vec4(a_pos, 0.0, 1.0);',
'}'
].join('\n');
var FS = [
'precision highp float;',
'varying vec2 v_uv;',
'uniform float u_time;',
'uniform float u_warpTime;',
'uniform float u_ar;',
'uniform float u_fitT;',
'uniform vec2  u_mouse;',
'uniform float u_interact;',
'uniform vec2  u_res;',
'uniform vec2  u_seed;',
'uniform vec2  u_bdir;',
'uniform vec3  u_emberCol;',
'uniform sampler2D u_text;',
'float hash(vec2 p){',
'  p = fract(p*vec2(123.34, 456.21));',
'  p += dot(p, p+45.32);',
'  return fract(p.x*p.y);',
'}',
'float vnoise(vec2 p){',
'  vec2 i=floor(p), f=fract(p);',
'  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);',
'  float a=hash(i+vec2(0,0));',
'  float b=hash(i+vec2(1,0));',
'  float c=hash(i+vec2(0,1));',
'  float d=hash(i+vec2(1,1));',
'  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);',
'}',
'float flow(vec2 p){',
'  float v=0.0;',
'  v += 0.60*vnoise(p);          p = p*1.9 + vec2(2.1, 8.3);',
'  v += 0.30*vnoise(p);          p = p*1.9 + vec2(5.7, 1.2);',
'  v += 0.10*vnoise(p);',
'  return v;',
'}',
'vec3 aces(vec3 x){',
'  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);',
'}',
'float dither(vec2 uv){',
'  float r = hash(uv*vec2(311.7,127.1));',
'  float g = hash(uv*vec2(269.5,183.3)+17.0);',
'  return (r+g-1.0);',
'}',
'void main(){',
'  vec2 uv = v_uv;',
'  float ar = u_ar;',
'  vec2 auv    = vec2((uv.x-0.5)*ar, uv.y-0.5);',
'  vec2 amouse = vec2((u_mouse.x-0.5)*ar, u_mouse.y-0.5);',
'  float t = u_time;',
'  vec2 p = uv * vec2(2.6*ar, 2.6) + u_seed;',
'  float tw = u_warpTime;',
'  vec2 q = vec2(',
'    flow(p + vec2(0.0, 0.0) + tw*0.008),',
'    flow(p + vec2(5.2, 1.3) - tw*0.006)',
'  );',
'  vec2 r = vec2(',
'    flow(p + 3.0*q + vec2(1.7, 9.2) + tw*0.010),',
'    flow(p + 3.0*q + vec2(8.3, 2.8) - tw*0.007)',
'  );',
'  float silk = flow(p + 2.4*r);',
'  float e = 0.0016;',
'  float sx = flow(p+vec2(e,0.0)+2.4*r) - silk;',
'  float sy = flow(p+vec2(0.0,e)+2.4*r) - silk;',
'  vec2 slope = vec2(sx, sy)/e;',
'  vec3 deep   = vec3(0.024, 0.014, 0.012);',
'  vec3 carbon = vec3(0.075, 0.050, 0.046);',
'  vec3 smoke  = vec3(0.230, 0.075, 0.060);',
'  vec3 col = mix(deep, carbon, smoothstep(0.30, 0.62, silk));',
'  col = mix(col, smoke, smoothstep(0.60, 0.92, silk));',
'  float sheenDir = slope.x*0.7 - slope.y*0.7;',
'  float sheenPhase = silk*7.0 + sheenDir*2.2;',
'  float sb = clamp(0.5+0.5*sin(sheenPhase), 0.0, 1.0);',
'  float sheen = sb*sb*sb*sqrt(sb);',
'  float irid = 0.5 + 0.5*sin(sheenPhase*0.5 + silk*3.0);',
'  vec3 copper  = vec3(0.40, 0.20, 0.11);',
'  vec3 crimson = vec3(0.34, 0.06, 0.05);',
'  vec3 sheenCol = mix(crimson, copper, irid);',
'  col += sheenCol * sheen * smoothstep(0.45,0.95,silk) * (1.0 - u_interact*0.25);',
'  float bandCoord = dot(uv, u_bdir) - t*0.009;',
'  float band = pow(0.5+0.5*sin(bandCoord*3.1416 + u_seed.y*6.2831), 2.2);',
'  col += sheenCol * band * sheen * 0.5 * (1.0 - u_interact*0.25);',
'  float breath = 0.55 + 0.45*sin(t*0.13 + silk*4.0 + u_seed.x*6.2831);',
'  float emberMask = smoothstep(0.55, 0.95, silk);',
'  float emberBase = emberMask * breath;',
'  vec3 burnCol = u_emberCol;',
'  float emberStr = emberBase * 0.40;',
'  if (u_interact > 0.0001) {',
'    float flick = 0.80 + 0.20*sin(t*2.3 + silk*8.0)*sin(t*1.7 + silk*5.0);',
'    burnCol = mix(u_emberCol, vec3(0.80, 0.14, 0.022), u_interact*0.82);',
'    emberStr = emberBase * (0.40 + u_interact*2.5*flick);',
'  }',
'  col += burnCol * emberStr;',
'  col += vec3(0.030, 0.006, 0.004) * silk * (1.0 + u_interact*0.6);',
'  vec3 ice    = vec3(0.918, 0.965, 1.000);',
'  vec3 cobalt = vec3(0.162, 0.502, 1.000);',
'  vec3 abyss  = vec3(0.039, 0.118, 0.353);',
'  float light = 0.0;',
'  float ambient = 0.0;',
'  vec3 lightCol = vec3(0.0);',
'  if (u_interact > 0.0001) {',
'    float ir  = u_interact;',
'    float ir2 = ir*ir;',
'    float ir4 = ir2*ir2;',
'    vec2 lflow = vec2(',
'      flow(p*0.85 + vec2( t*0.028, -t*0.009) + 11.3),',
'      flow(p*0.85 + vec2(-t*0.011,  t*0.026) + 23.7)',
'    ) - 0.5;',
'    vec2 inkOffset = (lflow*0.26 + (r-0.5)*0.16) * (0.45 + ir);',
'    vec2 lp = auv + inkOffset;',
'    float dist = length(lp - amouse);',
'    float lR = (0.30 + ir2*0.75) * (1.0 + 0.06*sin(t*0.45 + silk*3.0));',
'    float lRm = lR * (0.85 + 0.30*silk + 0.10*lflow.x);',
'    float glow = exp(-dist*dist / (lRm*lRm + 0.0001));',
'    float wide = exp(-dist*dist / (lR*lR*3.5 + 0.0001));',
'    float cDist = length(auv*0.5);',
'    ambient = ir4*0.60*exp(-cDist*2.2);',
'    light = (glow*0.62 + wide*0.38) * ir;',
'    light = max(light, ambient*ir);',
'    float lr = clamp(dist/max(lR,0.01), 0.0, 2.2);',
'    float nearMouse = 1.0 - smoothstep(0.20, 1.6, lr);',
'    lightCol = mix(abyss, cobalt, nearMouse);',
'  }',
'  col = clamp((col - 0.14)*(1.0 + light*1.45) + 0.14, 0.0, 1.0);',
'  float redKeep = clamp(emberStr*1.3, 0.0, 0.86);',
'  col = mix(col, lightCol, clamp(light*0.92, 0.0, 0.82) * (1.0 - redKeep));',
'  col += lightCol * light * 0.30 * (1.0 - redKeep);',
'  col += abyss * ambient * 0.9 * (1.0 - redKeep*0.6);',
'  col += vec3(0.10,0.30,0.55) * sheen * light * 0.5 * (1.0 - redKeep*0.7);',
'  float fitT = u_fitT;',
'  vec2 tuv = vec2(auv.x/(2.0*fitT), auv.y/fitT) + 0.5;',
'  vec2 inb = step(vec2(0.0), tuv) * step(tuv, vec2(1.0));',
'  float tx = texture2D(u_text, tuv).r * inb.x * inb.y;',
'  float depth = 1.0 + (1.0-uv.y)*0.55;',
'  float rev = smoothstep(0.02, 0.45*depth, light);',
'  rev = max(rev, smoothstep(0.12, 0.85, u_interact)*0.9);',
'  vec3 tcol = mix(vec3(0.0), vec3(1.0), rev);',
'  float a = tx * mix(0.22, 0.99, rev);',
'  col = mix(col, tcol, a);',
'  col += mix(cobalt, ice, 0.5) * smoothstep(0.04,0.30,light) * tx * 0.30;',
'  col *= 0.88 + 0.12*uv.y;',
'  float vd = length((uv-0.5)*vec2(1.05,1.0))*2.2;',
'  float vig = 1.0 - smoothstep(0.25, 1.05, vd);',
'  col *= 0.38 + 0.62*vig;',
'  col = aces(col*1.20);',
'  float luma = dot(col, vec3(0.299,0.587,0.114));',
'  col += vec3(-0.010,0.0,0.018) * (1.0-luma);',
'  col += vec3( 0.014,0.004,-0.006) * luma;',
'  col = clamp(col, 0.0, 1.0);',
'  col = mix(vec3(luma), col, 1.10);',
'  col = clamp((col-0.5)*1.06 + 0.5, 0.0, 1.0);',
'  col += dither(uv*u_res) * (1.0/255.0);',
'  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);',
'}'
].join('\n');
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false})
      || canvas.getContext('experimental-webgl',{antialias:false,alpha:false});
if (!gl) {
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}
function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('[shader]', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
var prog = gl.createProgram();
var vs = compile(gl.VERTEX_SHADER, VS);
var fs = compile(gl.FRAGMENT_SHADER, FS);
if (!vs || !fs) {
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('[program]', gl.getProgramInfoLog(prog));
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
  return;
}
gl.useProgram(prog);
var vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
var U = {
  time:     gl.getUniformLocation(prog,'u_time'),
  warpTime: gl.getUniformLocation(prog,'u_warpTime'),
  ar:       gl.getUniformLocation(prog,'u_ar'),
  fitT:     gl.getUniformLocation(prog,'u_fitT'),
  mouse:    gl.getUniformLocation(prog,'u_mouse'),
  interact: gl.getUniformLocation(prog,'u_interact'),
  res:      gl.getUniformLocation(prog,'u_res'),
  seed:     gl.getUniformLocation(prog,'u_seed'),
  bdir:     gl.getUniformLocation(prog,'u_bdir'),
  emberCol: gl.getUniformLocation(prog,'u_emberCol'),
  text:     gl.getUniformLocation(prog,'u_text')
};
var seedX = Math.random()*1000.0;
var seedY = Math.random()*1000.0;
gl.uniform2f(U.seed, seedX, seedY);
var bang = seedX*1.7 + seedY*0.9;
var bdx = Math.cos(bang), bdy = Math.sin(bang);
var blen = Math.sqrt(bdx*bdx + bdy*bdy) || 1.0;
gl.uniform2f(U.bdir, bdx/blen, bdy/blen);
var warmth = 0.5 + 0.5*Math.sin(seedX*2.3 + seedY*1.1);
gl.uniform3f(U.emberCol,
  0.46 + (0.55-0.46)*warmth,
  0.070 + (0.110-0.070)*warmth,
  0.045 + (0.022-0.045)*warmth);
var SYS = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
function drawTracked(ctx, text, cx, y, trackPx) {
  var widths = [], total = 0;
  for (var i = 0; i < text.length; i++) {
    var w = ctx.measureText(text[i]).width;
    widths.push(w);
    total += w + (i < text.length - 1 ? trackPx : 0);
  }
  var x = cx - total / 2;
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  for (var j = 0; j < text.length; j++) {
    ctx.fillText(text[j], x, y);
    x += widths[j] + trackPx;
  }
  ctx.textAlign = prevAlign;
}
function buildTextTexture(existing) {
  var W = 2048, H = 1024;
  var tc = document.createElement('canvas');
  tc.width = W; tc.height = H;
  var ctx = tc.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  var cx   = W/2;
  var tyY  = H*0.380;
  var sepY = H*0.520;
  var suY  = H*0.620;
  var titleTrack = 4;
  ctx.font = '600 196px ' + SYS;
  ctx.save(); ctx.globalAlpha=0.09; ctx.filter='blur(34px)'; drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.20; ctx.filter='blur(15px)'; drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.42; ctx.filter='blur(5px)';  drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=1.00; ctx.filter='none';       drawTracked(ctx,'FOBOS',cx,tyY,titleTrack); ctx.restore();
  ctx.save();
  var lineW = 150;
  var g = ctx.createLinearGradient(cx-lineW, sepY, cx+lineW, sepY);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.55)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.strokeStyle = g; ctx.lineWidth = 1.0;
  ctx.beginPath(); ctx.moveTo(cx-lineW,sepY); ctx.lineTo(cx+lineW,sepY); ctx.stroke();
  ctx.restore();
  var sub = 'un server di test di Industree Hub';
  var subTrack = 3;
  ctx.font = '400 30px ' + SYS;
  ctx.save(); ctx.globalAlpha=0.13; ctx.filter='blur(12px)'; drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.38; ctx.filter='blur(3px)';  drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.92; ctx.filter='none';       drawTracked(ctx,sub,cx,suY,subTrack); ctx.restore();
  var tex = existing || gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
var textTex = buildTextTexture();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){ buildTextTexture(textTex); });
}
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, textTex);
gl.uniform1i(U.text, 0);
function applyResize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var w = canvas.clientWidth  || window.innerWidth;
  var h = canvas.clientHeight || window.innerHeight;
  canvas.width  = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.res, canvas.width, canvas.height);
  var ar = canvas.width / canvas.height;
  gl.uniform1f(U.ar, ar);
  gl.uniform1f(U.fitT, Math.min(ar/2.0, 1.0) * 1.42);
}
var pendingResize = false;
function markResize(){ pendingResize = true; }
window.addEventListener('resize',            markResize, { passive: true });
window.addEventListener('orientationchange', markResize, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', markResize, { passive: true });
}
applyResize();
var tx=0.5, ty=0.5, sx=0.5, sy=0.5;
var interact=0.0, lastMove=-1e9, isActive=false;
function clamp01(v){ return v<0?0:(v>1?1:v); }
function onPointer(e){
  var rc = canvas.getBoundingClientRect();
  tx = clamp01((e.clientX - rc.left)/rc.width);
  ty = clamp01(1.0 - (e.clientY - rc.top)/rc.height);
  lastMove = performance.now();
  isActive = true;
}
canvas.addEventListener('pointermove', onPointer, {passive:true});
canvas.addEventListener('pointerdown', onPointer, {passive:true});
window.addEventListener('pointerup',     function(){ isActive=false; }, {passive:true});
window.addEventListener('pointercancel', function(){ isActive=false; }, {passive:true});
window.addEventListener('pointerleave',  function(){ isActive=false; }, {passive:true});
var startT = performance.now();
var prevT  = startT;
var elapsed  = 0.0;
var warpTime = 0.0;
var rafId = 0;
var running = true;
function render(now) {
  if (!running) return;
  rafId = requestAnimationFrame(render);
  if (pendingResize) { applyResize(); pendingResize = false; }
  var dt = Math.min((now - prevT)*0.001, 0.05);
  prevT = now;
  elapsed += dt;
  var alpha = 1.0 - Math.exp(-3.6*dt);
  sx += (tx - sx)*alpha;
  sy += (ty - sy)*alpha;
  var moving = isActive && (now - lastMove) < 120;
  if (moving) interact = Math.min(1.0, interact + dt*1.5);
  else        interact = Math.max(0.0, interact - dt*0.22);
  warpTime += dt * (1.0 + interact*0.85);
  gl.uniform1f(U.time,     elapsed);
  gl.uniform1f(U.warpTime, warpTime);
  gl.uniform2f(U.mouse,    sx, sy);
  gl.uniform1f(U.interact, interact);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Pausa quando la tab non è visibile (risparmio batteria/calore)
document.addEventListener('visibilitychange', function(){
  if (document.hidden) {
    running = false;
    cancelAnimationFrame(rafId);
  } else if (!running) {
    running = true;
    prevT = performance.now();   // evita un salto di dt al risveglio
    rafId = requestAnimationFrame(render);
  }
}, false);

// Perdita del contesto WebGL (può capitare su mobile): ferma e mostra il fallback
canvas.addEventListener('webglcontextlost', function(e){
  e.preventDefault();
  running = false;
  cancelAnimationFrame(rafId);
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
}, false);

rafId = requestAnimationFrame(render);
}());
</script>
</body>
</html>
